<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Bitolpoka</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background: #FCF9FA; color: #020706; }
  .font-display { font-family: 'Fraunces', serif; }
  .btn-primary { background: #016236; color: white; padding: 1rem; border-radius: 1rem; font-weight: bold; width: 100%; transition: opacity 0.2s; }
  .btn-primary:disabled { opacity: 0.5; }
  .input-field { width: 100%; padding: 0.75rem; border: 1px solid #E2E8F0; border-radius: 0.5rem; margin-top: 0.25rem; }
  .card { background: white; border: 1px solid #E2E8F0; border-radius: 1rem; padding: 1.5rem; }
</style>
</head>
<body>

<header class="bg-white border-b p-4">
  <div class="max-w-4xl mx-auto flex justify-between items-center">
    <a href="catalog.html" class="text-gray-500 font-bold">&larr; Back</a>
    <span class="font-display font-bold text-xl">Checkout</span>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-2 gap-8">
  <div>
    <h2 class="font-bold text-xl mb-4">Your Order</h2>
    <div id="cart-list" class="space-y-4 mb-6"></div>
    <div class="card bg-gray-50">
      <div class="flex justify-between mb-2"><span>Subtotal</span><span id="subtotal">৳0</span></div>
      <div class="flex justify-between mb-4 pb-4 border-b"><span>Delivery</span><span id="delivery">৳150</span></div>
      <div class="flex justify-between font-bold text-lg"><span>Total</span><span id="grand-total">৳0</span></div>
    </div>
  </div>

  <div class="card">
    <h2 class="font-bold text-xl mb-4">Delivery Details</h2>
    <div class="space-y-4">
      <div><label class="text-sm font-bold">Name</label><input type="text" id="name" class="input-field"></div>
      <div><label class="text-sm font-bold">Phone</label><input type="text" id="phone" class="input-field"></div>
      <div><label class="text-sm font-bold">Address</label><textarea id="address" class="input-field"></textarea></div>
      
      <div id="advance-block" class="hidden p-4 bg-orange-50 border border-orange-200 rounded-lg mt-4">
        <p class="font-bold text-sm mb-2 text-orange-800">Advance Payment Required</p>
        <p class="text-xs mb-2">Send money to bKash: <strong id="bkash-num">Loading...</strong></p>
        <input type="text" id="trxid" placeholder="Enter TrxID" class="input-field">
      </div>

      <button id="submit-btn" onclick="submitOrder()" class="btn-primary mt-6">Confirm Order</button>
      <p id="msg" class="text-center mt-2 text-sm font-bold"></p>
    </div>
  </div>
</main>

<script>
  const db = supabase.createClient('https://frifscjexvqhtptiwear.supabase.co', 'sb_publishable_BQFducZtr7aIkYW4G8t7VA_p77ORs24');
  let cart = JSON.parse(localStorage.getItem('bp_cart') || '[]');
  let settings = { delivery_charge: 150, bkash_number: '' };

  async function loadSetup() {
    const { data } = await db.from('store_settings').select('*').single();
    if (data) settings = data;
    document.getElementById('bkash-num').textContent = settings.bkash_number || 'N/A';
    renderCart();
  }

  function renderCart() {
    const list = document.getElementById('cart-list');
    if (cart.length === 0) { list.innerHTML = '<p>Cart is empty.</p>'; document.getElementById('submit-btn').disabled = true; return; }
    
    let sub = 0;
    let needsAdvance = false;
    list.innerHTML = cart.map((item, i) => {
      sub += item.total;
      if (item.payment_option === 'Advance Payment') needsAdvance = true;
      return `<div class="flex justify-between border-b pb-2"><div><p class="font-bold">${item.name}</p><p class="text-sm text-gray-500">${item.qty} ${item.unit || 'pcs'}</p></div><div class="text-right font-bold">৳${item.total}<br><button onclick="rm(${i})" class="text-xs text-red-500 font-normal">Remove</button></div></div>`;
    }).join('');

    document.getElementById('subtotal').textContent = `৳${sub}`;
    document.getElementById('delivery').textContent = `৳${settings.delivery_charge}`;
    document.getElementById('grand-total').textContent = `৳${sub + settings.delivery_charge}`;
    
    const advBlock = document.getElementById('advance-block');
    if (needsAdvance) { advBlock.classList.remove('hidden'); document.getElementById('submit-btn').textContent = "Submit TrxID & Confirm"; }
    else { advBlock.classList.add('hidden'); document.getElementById('submit-btn').textContent = "Confirm COD Order"; }
  }

  window.rm = function(i) { cart.splice(i, 1); localStorage.setItem('bp_cart', JSON.stringify(cart)); renderCart(); }

  async function submitOrder() {
    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;
    const addr = document.getElementById('address').value;
    const trx = document.getElementById('trxid').value;
    const isAdv = !document.getElementById('advance-block').classList.contains('hidden');

    if (!name || !phone || !addr) return alert('Fill all details');
    if (isAdv && !trx) return alert('TrxID required for advance payment items');

    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = 'Processing...';

    const payloads = cart.map((item, idx) => ({
      product_id: item.id, product_name: item.name, quantity: item.qty, unit_type: item.unit, 
      unit_price: item.total/item.qty, total_amount: idx === 0 ? item.total + settings.delivery_charge : item.total,
      customer_name: name, customer_phone: phone, delivery_address: addr, transaction_id: trx || null,
      payment_method: isAdv ? 'bKash/Nagod' : 'Cash on Delivery'
    }));

    const { error } = await db.from('orders').insert(payloads);
    if (error) { document.getElementById('msg').textContent = "Error: " + error.message; btn.disabled = false; }
    else {
      localStorage.removeItem('bp_cart');
      document.body.innerHTML = `<div class="max-w-md mx-auto mt-20 text-center p-8 bg-white rounded-xl shadow"><h1 class="text-2xl font-bold text-green-600 mb-4">Order Placed!</h1><p>${isAdv ? 'We will verify your TrxID shortly.' : 'Your COD order is confirmed.'}</p><a href="index.html" class="block mt-6 text-blue-500 underline">Return Home</a></div>`;
    }
  }

  loadSetup();
</script>
</body>
</html>
