<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitolpoka — Premium Live Insect Feed</title>
<script>
  if (window.location.protocol === 'http:' && window.location.hostname !== 'localhost') {
    window.location.href = window.location.href.replace('http:', 'https:');
  }
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: { canvas: '#FCF9FA', forest: '#016236', charcoal: '#020706', borderline: '#E2E8F0' } } }
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background: #FCF9FA; color: #020706; }
  .font-display { font-family: 'Fraunces', serif; }
  .btn-primary { background: #016236; color: white; padding: 0.75rem 1.5rem; border-radius: 1rem; font-weight: bold; transition: all 0.2s; }
  .btn-primary:hover { background: #014A28; transform: translateY(-2px); }
  .card { background: white; border: 1px solid #E2E8F0; border-radius: 1.5rem; padding: 1.5rem; transition: transform 0.2s; }
  .card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(1,98,54,0.1); }
</style>
</head>
<body>

<header class="fixed w-full top-0 z-40 bg-white/80 backdrop-blur-md border-b border-gray-200">
  <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-2 cursor-pointer">
      <div class="w-8 h-8 bg-forest rounded-lg flex items-center justify-center"><svg width="16" height="16" fill="white" viewBox="0 0 24 24"><path d="M12 22V12M12 12C12 7 8 5 4 5c0 5 3 8 8 8M12 12c0-5 4-7 8-7 0 5-3 8-8 8" stroke="white" stroke-width="2"/></svg></div>
      <span class="font-display font-bold text-xl">Bitolpoka</span>
    </div>
    <nav class="flex gap-4 items-center">
      <a href="catalog.html" class="font-semibold text-gray-700 hover:text-forest">Catalog</a>
      <a href="checkout.html" class="btn-primary text-sm relative">
        Cart <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs hidden">0</span>
      </a>
    </nav>
  </div>
</header>

<main class="pt-28 pb-20 max-w-6xl mx-auto px-6">
  <section class="text-center py-16">
    <span class="bg-forest/10 text-forest px-3 py-1 rounded-full text-sm font-bold tracking-wide">Farmed Weekly in Khulna</span>
    <h1 class="font-display text-5xl font-bold mt-6 mb-4">Bred Fresh.<br><span class="text-forest">Delivered Live.</span></h1>
    <p class="text-gray-600 max-w-xl mx-auto mb-8">Premium mealworms and superworms for your poultry and exotic pets.</p>
    <a href="catalog.html" class="btn-primary text-lg">Browse Catalog</a>
  </section>

  <section class="mt-16">
    <h2 class="font-display text-3xl font-bold mb-8 text-center">Featured Feed</h2>
    <div id="featured-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="text-center text-gray-500">Loading features...</div>
    </div>
  </section>
</main>

<script>
  const db = supabase.createClient('https://frifscjexvqhtptiwear.supabase.co', 'sb_publishable_BQFducZtr7aIkYW4G8t7VA_p77ORs24');

  async function loadFeatured() {
    const { data } = await db.from('products').select('*').limit(3);
    if (!data) return;
    
    document.getElementById('featured-grid').innerHTML = data.map(p => {
      const img = (p.image_urls && p.image_urls.length > 0) ? p.image_urls[0] : 'https://placehold.co/400x300?text=No+Image';
      return `
        <div class="card cursor-pointer" onclick="window.location.href='catalog.html'">
          <img src="${img}" class="w-full h-48 object-cover rounded-xl mb-4">
          <h3 class="font-bold text-lg">${p.name}</h3>
          <p class="text-forest font-bold mt-2">From ৳${p.price}</p>
        </div>
      `;
    }).join('');
  }

  function updateCartBadge() {
    const cart = JSON.parse(localStorage.getItem('bp_cart') || '[]');
    const badge = document.getElementById('cart-count');
    if (cart.length > 0) {
      badge.textContent = cart.length;
      badge.classList.remove('hidden');
    }
  }

  loadFeatured();
  updateCartBadge();
</script>
</body>
</html>
