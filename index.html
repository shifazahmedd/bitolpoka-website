<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitolpoka — Premium Live Insect Feed</title>

<script>
  if (window.location.protocol === 'http:' && window.location.hostname !== 'localhost') {
    window.location.href = window.location.href.replace('http:', 'https:');
  }
</script>

<meta name="description" content="Live mealworms, superworms and breeder beetles, farmed weekly in Khulna, Bangladesh. Cash on delivery, nationwide.">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          canvas: '#FCF9FA',
          forest: '#016236',
          charcoal: '#020706',
          surface: '#FFFFFF',
          borderline: '#E2E8F0', 
        }
      }
    }
  }
</script>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  body { font-family: 'Inter', sans-serif; background: #FCF9FA; color: #020706; }
  .font-display { font-family: 'Fraunces', serif; }
  .skeleton { border-radius: 1rem; background: #E2E8F0; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
</style>
</head>
<body>

<header class="fixed w-full top-0 z-40 bg-white/70 backdrop-blur-xl border-b border-gray-200">
  <div class="max-w-[80rem] mx-auto px-6 py-4 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-forest flex items-center justify-center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"><path d="M12 22V12"/><path d="M12 12C12 7 8 5 4 5c0 5 3 8 8 8"/><path d="M12 12c0-5 4-7 8-7 0 5-3 8-8 8"/></svg>
      </div>
      <span class="font-display text-[1.4rem] font-bold">Bitolpoka</span>
    </a>
  </div>
</header>

<section class="pt-32 pb-16 lg:pt-40 lg:pb-32 px-6 max-w-[80rem] mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12">
    <div>
        <h1 class="font-display text-5xl font-extrabold mb-6">Bred Fresh.<br><span class="text-forest">Delivered Live.</span></h1>
        <p class="text-lg mb-8">Bitolpoka farms premium mealworms and superworms. Stop wasting money on chemical feeds.</p>
        <button onclick="document.getElementById('products-section').scrollIntoView({behavior:'smooth'})" class="bg-forest text-white px-8 py-4 rounded-2xl font-bold">Browse Live Feed</button>
    </div>
</section>

<section id="products-section" class="py-20 lg:py-32 relative z-20">
  <div class="max-w-[80rem] mx-auto px-6 lg:px-8">
    <h2 class="font-display text-4xl text-center font-extrabold text-charcoal mb-16">Choose Your Live Feed</h2>

    <div id="products-loading" class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <div class="bg-white rounded-3xl p-6 border"><div class="skeleton aspect-video mb-4"></div><div class="skeleton h-6 w-1/2 mb-3"></div></div>
    </div>
    <div id="products-grid" class="hidden grid grid-cols-1 md:grid-cols-3 gap-8"></div>
  </div>
</section>

<footer class="bg-charcoal text-white pt-16 pb-8 text-center text-sm">
  <p>&copy; 2026 Bitolpoka Farms.</p>
</footer>

<script>
  const db = window.supabase.createClient('https://frifscjexvqhtptiwear.supabase.co', 'sb_publishable_BQFducZtr7aIkYW4G8t7VA_p77ORs24');

  async function loadProducts() {
    const { data, error } = await db.from('products').select('*');
    document.getElementById('products-loading').style.display = 'none';
    if(error || !data.length) return;

    const grid = document.getElementById('products-grid');
    grid.innerHTML = data.map(p => {
      let img = p.image_urls ? (typeof p.image_urls === 'string' ? JSON.parse(p.image_urls)[0] : p.image_urls[0]) : '';
      return `
        <a href="product.html?id=${p.id}" class="bg-white border rounded-[2rem] p-6 hover:-translate-y-2 transition-transform shadow-sm block">
          <img src="${img}" class="w-full aspect-square object-cover rounded-xl mb-4 bg-slate-50">
          <h3 class="font-display font-bold text-xl mb-2 text-charcoal">${p.name}</h3>
          <p class="font-bold text-forest text-lg">৳${p.price} <span class="text-sm text-gray-500 font-normal">/ ${p.unit_type || 'pcs'}</span></p>
        </a>`;
    }).join('');
    grid.classList.remove('hidden');
  }
  
  loadProducts();
</script>
</body>
</html>
