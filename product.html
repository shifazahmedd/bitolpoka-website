<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details — Bitolpoka</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script>
  tailwind.config = { theme: { extend: { colors: { forest: '#016236', charcoal: '#020706' } } } }
</script>
<style>
  body { font-family: 'Inter', sans-serif; background: #FCF9FA; color: #020706; }
  .font-display { font-family: 'Fraunces', serif; }
  .btn-primary { background: #016236; color: white; padding: 1rem; border-radius: 1rem; font-weight: bold; width: 100%; text-align: center;}
  .pkg-btn { border: 2px solid #E2E8F0; padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: bold; cursor: pointer; background: white; }
  .pkg-btn.active { border-color: #016236; background: #016236; color: white; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 50; }
  .modal-box { background: white; padding: 2rem; border-radius: 1.5rem; width: 100%; max-width: 400px; }
  .input-field { width: 100%; padding: 0.75rem; border: 1px solid #E2E8F0; border-radius: 0.5rem; margin-bottom: 1rem; }
</style>
</head>
<body>

<header class="bg-white border-b p-4">
  <div class="max-w-4xl mx-auto flex justify-between items-center">
    <a href="index.html" class="font-bold text-forest">&larr; Back to Shop</a>
    <button onclick="openCart()" id="cart-btn" class="hidden bg-forest text-white px-4 py-2 rounded-xl font-bold">Cart (<span id="cart-count">0</span>)</button>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-8">
  <div id="loading" class="text-center py-20 text-gray-500">Loading Product...</div>
  <div id="product-display" class="hidden grid grid-cols-1 md:grid-cols-2 gap-8 bg-white p-8 rounded-2xl border"></div>
</main>

<div id="modal-overlay" class="modal-overlay">
  <div class="modal-box">
    <div id="cart-view">
      <h2 class="font-bold text-xl mb-4">Cart</h2>
      <div id="cart-list"></div>
      <div id="cart-totals" class="my-4 font-bold"></div>
      <button onclick="showCheckout()" class="btn-primary">Checkout</button>
      <button onclick="closeModal()" class="w-full mt-2 text-gray-500">Close</button>
    </div>
    
    <div id="checkout-view" class="hidden">
      <h2 class="font-bold text-xl mb-4">Delivery Info</h2>
      <input type="text" id="name" placeholder="Name" class="input-field">
      <input type="text" id="phone" placeholder="Phone" class="input-field">
      <textarea id="address" placeholder="Address" class="input-field"></textarea>
      
      <div id="adv-block" class="hidden bg-orange-50 p-3 rounded mb-4">
        <p class="font-bold text-sm text-orange-800">Advance Payment</p>
        <p class="text-xs mb-2">bKash: <span id="bkash-num"></span></p>
        <input type="text" id="trxid" placeholder="TrxID" class="input-field mb-0">
      </div>
      
      <button onclick="submitOrder()" id="submit-btn" class="btn-primary">Confirm Order</button>
      <button onclick="document.getElementById('checkout-view').classList.add('hidden'); document.getElementById('cart-view').classList.remove('hidden');" class="w-full mt-2 text-gray-500">Back</button>
    </div>
  </div>
</div>

<script>
  const db = window.supabase.createClient('https://frifscjexvqhtptiwear.supabase.co', 'sb_publishable_BQFducZtr7aIkYW4G8t7VA_p77ORs24');
  let product = null, pkgs = [], selPkg = null, cart = JSON.parse(localStorage.getItem('cart')||'[]'), settings = {};

  async function loadData() {
    const id = new URLSearchParams(window.location.search).get('id');
    const [pRes, sRes] = await Promise.all([db.from('products').select('*').eq('id', id).single(), db.from('store_settings').select('*').single()]);
    product = pRes.data; settings = sRes.data || {delivery_charge: 150};
    document.getElementById('bkash-num').textContent = settings.bkash_number;
    
    if(product.packages) {
      pkgs = product.packages.split(',').map(p => { const [q, pr] = p.split(':'); return {qty: parseInt(q), price: parseFloat(pr)}; });
    } else pkgs = [{qty: 1, price: product.price}];
    selPkg = pkgs[0];
    
    render();
    updateCartBtn();
  }

  function render() {
    document.getElementById('loading').classList.add('hidden');
    let img = product.image_urls ? (typeof product.image_urls === 'string' ? JSON.parse(product.image_urls)[0] : product.image_urls[0]) : '';
    
    document.getElementById('product-display').innerHTML = `
      <div><img src="${img}" class="w-full rounded-xl bg-gray-100"></div>
      <div>
        <h1 class="font-display text-3xl font-bold mb-2">${product.name}</h1>
        <p class="text-2xl font-bold text-forest mb-4">৳<span id="price">${selPkg.price}</span> / ${product.unit_type||'pcs'}</p>
        <p class="mb-4 text-gray-600">${product.description||''}</p>
        <div class="flex gap-2 mb-6">${pkgs.map((p,i)=>`<button onclick="setPkg(${i})" class="pkg-btn ${i===0?'active':''}">${p.qty} ${product.unit_type||'pcs'}</button>`).join('')}</div>
        <button onclick="addToCart()" class="btn-primary">Add to Cart</button>
      </div>`;
    document.getElementById('product-display').classList.remove('hidden');
  }

  window.setPkg = (i) => {
    selPkg = pkgs[i];
    document.getElementById('price').textContent = selPkg.price;
    document.querySelectorAll('.pkg-btn').forEach((b,idx)=>b.classList.toggle('active', i===idx));
  }

  window.addToCart = () => {
    cart.push({ id: product.id, name: product.name, qty: selPkg.qty, unit: product.unit_type, total: selPkg.price, adv: product.payment_option === 'Advance Payment' });
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartBtn(); openCart();
  }

  function updateCartBtn() {
    const btn = document.getElementById('cart-btn');
    if(cart.length) { btn.classList.remove('hidden'); document.getElementById('cart-count').textContent = cart.length; }
    else btn.classList.add('hidden');
  }

  window.openCart = () => {
    let sub = 0;
    document.getElementById('cart-list').innerHTML = cart.map((c,i)=>{ sub+=c.total; return `<div class="flex justify-between border-b py-2"><span>${c.qty} ${c.name}</span><span>৳${c.total} <button onclick="rm(${i})" class="text-red-500 ml-2">X</button></span></div>`;}).join('');
    document.getElementById('cart-totals').innerHTML = `Subtotal: ৳${sub} <br> Delivery: ৳${settings.delivery_charge} <br> Total: ৳${sub + settings.delivery_charge}`;
    document.getElementById('modal-overlay').style.display='flex';
  }
  
  window.rm = (i) => { cart.splice(i,1); localStorage.setItem('cart', JSON.stringify(cart)); updateCartBtn(); if(cart.length)openCart(); else closeModal(); }

  window.showCheckout = () => {
    const needsAdv = cart.some(c=>c.adv);
    document.getElementById('adv-block').style.display = needsAdv ? 'block' : 'none';
    document.getElementById('cart-view').classList.add('hidden');
    document.getElementById('checkout-view').classList.remove('hidden');
  }

  window.submitOrder = async () => {
    const name=document.getElementById('name').value, phone=document.getElementById('phone').value, address=document.getElementById('address').value, trx=document.getElementById('trxid').value;
    const needsAdv = cart.some(c=>c.adv);
    if(!name||!phone||!address||(needsAdv&&!trx)) return alert('Fill required fields');
    
    document.getElementById('submit-btn').textContent = 'Processing...';
    
    const payloads = cart.map((c,i)=>({
      product_id: c.id, product_name: c.name, quantity: c.qty, unit_type: c.unit, total_amount: i===0?c.total+settings.delivery_charge:c.total,
      customer_name: name, customer_phone: phone, delivery_address: address, transaction_id: trx||null, payment_method: needsAdv?'bKash/Nagod':'COD'
    }));
    
    await db.from('orders').insert(payloads);
    cart=[]; localStorage.removeItem('cart');
    alert('Order Placed!'); window.location.href='index.html';
  }

  window.closeModal = () => { document.getElementById('modal-overlay').style.display='none'; document.getElementById('cart-view').classList.remove('hidden'); document.getElementById('checkout-view').classList.add('hidden'); }
  loadData();
</script>
</body>
</html>
