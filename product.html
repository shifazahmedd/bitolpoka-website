<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          canvas: '#FCF9FA',
          forest: '#016236',
          forestHover: '#014A28',
          charcoal: '#020706',
          surface: '#FFFFFF',
          borderline: '#E2E8F0', 
        },
        boxShadow: {
          'premium': '0 20px 40px -15px rgba(1, 98, 54, 0.1)',
          'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
        }

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --canvas:       #FCF9FA;
    --forest:       #016236;
    --charcoal:     #020706;
    --surface:      #FFFFFF;
    --border:       #E2E8F0;
  }
  
  *, *::before, *::after { box-sizing: border-box; }
  body { 
    font-family: 'Inter', system-ui, sans-serif; 
    background: var(--canvas); 
    color: var(--charcoal); 
    margin: 0; 
    -webkit-font-smoothing: antialiased;
  }
  .font-display { font-family: 'Fraunces', serif; }
  .font-mono    { font-family: 'IBM Plex Mono', monospace; }

  /* Premium Buttons */
  .btn-primary {
    background: var(--forest); 
    color: var(--surface);
    border: none; 
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 10px 25px -5px rgba(1, 98, 54, 0.3);
  }
  .btn-primary:hover:not(:disabled) { 
    background: #014A28; 
    transform: translateY(-3px) scale(1.02); 
    box-shadow: 0 20px 35px -5px rgba(1, 98, 54, 0.4);
  }
  .btn-primary:active:not(:disabled) { transform: translateY(0) scale(0.98); }
  .btn-primary:disabled { opacity: .65; cursor: not-allowed; transform: none; box-shadow: none; }

  /* Package Selector Buttons (Pills) */
  .pkg-btn {
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem; font-weight: 700;
    padding: 0.6rem 1rem; border-radius: 0.75rem; cursor: pointer;
    border: 2px solid var(--border);
    background: #F8FAFC; color: #475569;
    transition: all 0.2s ease;
    white-space: nowrap;
    display: inline-block;
  }
  .pkg-btn:hover { 
    border-color: var(--forest); 
    background: #F0FDF4; 
    color: var(--forest); 
  }
  .pkg-btn.active {
    border-color: var(--forest); 
    background: var(--forest);
    color: var(--surface); 
    box-shadow: 0 4px 12px rgba(1, 98, 54, 0.25);
  }
  .pkg-error { font-size: .75rem; color: #DC2626; margin-top: .5rem; display: none; font-weight: 600; }

  /* Form Inputs */
  .input-field {
    width: 100%; border: 1.5px solid var(--border);
    background: #F8FAFC; border-radius: 1rem;
    padding: 1rem 1.25rem; font-size: 1rem; font-weight: 500; color: var(--charcoal);
    outline: none; transition: all 0.2s ease; font-family: inherit;
  }
  .input-field:focus { 
    border-color: var(--forest); 
    background: var(--surface);
    box-shadow: 0 0 0 4px rgba(1, 98, 54, 0.1); 
  }

  /* Slider */
  .slider-thumb { border: 2px solid transparent; opacity: 0.6; cursor: pointer; border-radius: 0.5rem; overflow: hidden; transition: all 0.15s;}
  .slider-thumb.active { border-color: var(--forest); opacity: 1; }

  /* Modal Overlays */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 50;
    align-items: center; justify-content: center; padding: 1rem;
    background: rgba(2, 7, 6, 0.5); backdrop-filter: blur(8px);
    opacity: 0; transition: opacity 0.3s ease;
  }
  .modal-overlay.open { display: flex; opacity: 1; }
  
  .modal-box {
    background: var(--surface); border-radius: 2rem;
    width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    transform: translateY(20px) scale(0.95); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .modal-overlay.open .modal-box { transform: translateY(0) scale(1); }

  /* Checkout Rows */
  .price-row, .sum-row { display: flex; justify-content: space-between; gap: 1rem; padding: 0.75rem 0; font-size: 0.95rem; border-bottom: 1px dashed #E2E8F0; }
  .price-row span:first-child, .sum-row span:first-child { color: #64748B; font-weight: 500; }
  .price-row span:last-child, .sum-row span:last-child  { color: var(--charcoal); font-weight: 700; text-align: right; }
  .price-row.total-line, .sum-row.total-line { border-bottom: none; margin-top: 0.5rem; padding-top: 1rem; }
  .price-row.total-line span:first-child, .sum-row.total-line span:first-child { color: var(--charcoal); font-weight: 800; font-size: 1.1rem;}
  .price-row.total-line span:last-child, .sum-row.total-line span:last-child { color: var(--forest); font-size: 1.3rem; font-weight: 800; font-family: 'Fraunces', serif; }
</style>
</head>

<script>
'use strict';

/* ── Supabase client ── */
var SUPABASE_URL      = 'https://frifscjexvqhtptiwear.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_BQFducZtr7aIkYW4G8t7VA_p77ORs24';
var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ── State ── */
var PRODUCT          = null;
var IMAGES           = [];
var PACKAGES         = [];
var SEL_PKG          = null;
var CART             = JSON.parse(localStorage.getItem('bitolpoka_cart') || '[]');
var DELIVERY_CHARGE  = 150;
var STORE_SETTINGS   = {};

/* ═══════════════════════════════════════════════
   UTILITIES & INIT
   ═══════════════════════════════════════════════ */
function esc(s) { return s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function fmtBDT(n) { var v = Math.round((Number(n) + Number.EPSILON) * 100) / 100; return Number.isInteger(v) ? v.toString() : v.toFixed(2); }

async function loadProduct() {
  updateCartHeader();
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  if(!id) {
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('error-state').classList.remove('hidden');
      return;
  }

  var results = await Promise.all([
    db.from('products').select('*').eq('id', id).single(),
    db.from('store_settings').select('*').eq('id', 1).single()
  ]);

  if (results[1].data) {
      STORE_SETTINGS = results[1].data;
      if (STORE_SETTINGS.delivery_charge != null) DELIVERY_CHARGE = Number(STORE_SETTINGS.delivery_charge);
      if (STORE_SETTINGS.bkash_number) {
          var el = document.getElementById('display-bkash-number');
          if(el) el.textContent = STORE_SETTINGS.bkash_number;
      }
      if (STORE_SETTINGS.payment_instructions) {
          var el2 = document.getElementById('display-payment-instructions');
          if(el2) el2.innerHTML = esc(STORE_SETTINGS.payment_instructions);
      }
  }

  if (results[0].error || !results[0].data) {
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('error-state').classList.remove('hidden');
      return;
  }

  PRODUCT = results[0].data;
  document.getElementById('loading-state').classList.add('hidden');
  document.getElementById('product-container').classList.remove('hidden');
  renderProduct();
}

function renderProduct() {
  var arr = PRODUCT.image_urls;
  if (typeof arr === 'string') { try { arr = JSON.parse(arr); } catch(e) { arr = []; } }
  if (!Array.isArray(arr)) arr = [];
  IMAGES = arr.filter(function(x){ return x && typeof x === 'string'; });
  
  if (PRODUCT.packages) {
      PACKAGES = PRODUCT.packages.split(',').reduce(function(acc, token) {
        var parts = token.trim().split(':');
        var qty   = parseInt(parts[0], 10);
        var price = parseFloat(parts[1]);
        if (!isNaN(qty) && qty > 0 && !isNaN(price) && price >= 0) acc.push({ qty: qty, totalPrice: price });
        return acc;
      }, []);
  }
  if(PACKAGES.length === 0) PACKAGES = [{ qty: 1, totalPrice: PRODUCT.price }];
  SEL_PKG = PACKAGES[0];

  var html = '';
  // Left: Images
  html += '<div>';
  var mainImg = IMAGES[0] || 'https://placehold.co/600x600/f8fafc/94a3b8?text=No+Image';
  html += '<div class="aspect-square bg-slate-50 rounded-2xl border border-gray-200 overflow-hidden mb-4 relative">';
  html += '<img id="main-image" src="'+esc(mainImg)+'" class="w-full h-full object-cover transition-opacity duration-300">';
  html += '</div>';
  if (IMAGES.length > 1) {
      html += '<div class="flex gap-3 overflow-x-auto pb-2">';
      IMAGES.forEach(function(img, i) {
          html += '<button onclick="setImg('+i+')" id="thumb-'+i+'" class="slider-thumb w-16 h-16 shrink-0 '+(i===0?'active':'')+'"><img src="'+esc(img)+'" class="w-full h-full object-cover"></button>';
      });
      html += '</div>';
  }
  html += '</div>';

  // Right: Info
  html += '<div class="flex flex-col">';
  html += '<div class="mb-6 border-b border-gray-100 pb-6">';
  html += '<span class="text-[10px] font-bold px-3 py-1 bg-forest/10 text-forest rounded-full uppercase tracking-wider mb-3 inline-block">'+esc(PRODUCT.category || 'Live Feed')+'</span>';
  html += '<h1 class="font-display text-3xl md:text-4xl font-extrabold text-charcoal mb-4 tracking-tight">'+esc(PRODUCT.name)+'</h1>';
  
  var perUnit = SEL_PKG.totalPrice / SEL_PKG.qty;
  html += '<div class="flex items-baseline gap-2 mb-3">';
  html += '<span id="p-price" class="font-display text-4xl font-extrabold text-forest">&#2547;'+fmtBDT(perUnit)+'</span>';
  html += '<span id="p-unit" class="text-gray-500 font-medium">/ '+esc(PRODUCT.unit_type || 'pcs')+'</span>';
  html += '</div>';
  
  if (PRODUCT.payment_option === 'Advance Payment') {
      html += '<div class="p-2.5 bg-pink-50 border border-pink-100 rounded-xl inline-flex items-center gap-2 text-pink-600 mt-2">';
      html += '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>';
      html += '<span class="text-[10px] font-bold uppercase tracking-wider">Advance Payment Required</span>';
      html += '</div>';
  }
  html += '</div>';

  html += '<div class="mb-8 flex-grow">';
  html += '<p class="text-slate-600 leading-relaxed font-medium whitespace-pre-wrap">'+esc(PRODUCT.description)+'</p>';
  html += '</div>';

  html += '<div>';
  html += '<p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Select Package</p>';
  html += '<div class="flex flex-wrap gap-2 mb-4">';
  PACKAGES.forEach(function(p, i) {
      html += '<button onclick="setPkg('+i+')" id="pkg-btn-'+i+'" class="pkg-btn '+(i===0?'active':'')+'">'+p.qty+' '+esc(PRODUCT.unit_type || 'pcs')+'</button>';
  });
  html += '</div>';
  
  html += '<div class="flex items-center justify-between border-t border-gray-100 pt-6 mt-4">';
  html += '<div>';
  html += '<p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Subtotal</p>';
  html += '<p id="p-subtotal" class="font-mono text-xl font-bold text-charcoal">&#2547;'+fmtBDT(SEL_PKG.totalPrice)+'</p>';
  html += '</div>';
  html += '<button onclick="addToCart()" class="btn-primary px-8 py-3.5 rounded-xl font-bold text-lg">Add to Cart</button>';
  html += '</div>';
  html += '</div>';
  html += '</div>';

  document.getElementById('product-container').innerHTML = html;
}

window.setImg = function(i) {
  document.getElementById('main-image').src = IMAGES[i];
  var thumbs = document.querySelectorAll('.slider-thumb');
  for(var j=0; j<thumbs.length; j++) thumbs[j].classList.remove('active');
  document.getElementById('thumb-'+i).classList.add('active');
}

window.setPkg = function(i) {
  SEL_PKG = PACKAGES[i];
  var btns = document.querySelectorAll('.pkg-btn');
  for(var j=0; j<btns.length; j++) btns[j].classList.remove('active');
  document.getElementById('pkg-btn-'+i).classList.add('active');
  
  var perUnit = SEL_PKG.totalPrice / SEL_PKG.qty;
  document.getElementById('p-price').innerHTML = '&#2547;' + fmtBDT(perUnit);
  document.getElementById('p-subtotal').innerHTML = '&#2547;' + fmtBDT(SEL_PKG.totalPrice);
}

/* ═══════════════════════════════════════════════
   CART & CHECKOUT
   ═══════════════════════════════════════════════ */
function updateCartHeader() {
  var btn = document.getElementById('cart-header-btn');
  var countEl = document.getElementById('cart-count');
  if (CART.length > 0) {
    countEl.textContent = CART.length;
    btn.style.display = 'flex';
  } else {
    btn.style.display = 'none';
  }
}

window.addToCart = function() {
  CART.push({
    productId: PRODUCT.id,
    name: PRODUCT.name,
    qty: SEL_PKG.qty,
    unit: PRODUCT.unit_type || 'pcs',
    total: SEL_PKG.totalPrice,
    img: IMAGES[0] || '',
    payment_option: PRODUCT.payment_option || 'Cash on Delivery'
  });
  localStorage.setItem('bitolpoka_cart', JSON.stringify(CART));
  updateCartHeader();
  openCartModal();
}

window.removeFromCart = function(index) {
  CART.splice(index, 1);
  localStorage.setItem('bitolpoka_cart', JSON.stringify(CART));
  updateCartHeader();
  if (CART.length === 0) closeModal(); else openCartModal();
}

window.openCartModal = function() {
  if (CART.length === 0) return;
  var itemsHtml = ''; var subtotal = 0;
  CART.forEach(function(item, idx) {
    subtotal += item.total;
    var perUnit = item.total / item.qty;
    itemsHtml += 
      '<div style="display:flex;align-items:center;gap:1rem;padding:1rem 0;border-bottom:1px solid #E2E8F0;">' +
        '<div style="width:60px;height:60px;flex-shrink:0;background:#F8FAFC;border-radius:1rem;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #E2E8F0;">' +
          (item.img ? '<img src="' + esc(item.img) + '" style="width:100%;height:100%;object-fit:cover;">' : '') +
        '</div>' +
        '<div style="flex:1;min-width:0;">' +
          '<p style="font-weight:700;font-size:1.05rem;margin:0 0 .2rem;color:var(--charcoal);">' + esc(item.name) + '</p>' +
          '<p style="font-size:.85rem;font-weight:600;color:#64748B;margin:0;">' + item.qty + ' ' + esc(item.unit) + ' &times; &#2547;' + fmtBDT(perUnit) + '</p>' +
        '</div>' +
        '<div style="text-align:right;">' +
          '<p style="font-weight:800;font-size:1.1rem;margin:0 0 .3rem;color:var(--charcoal);">&#2547;' + fmtBDT(item.total) + '</p>' +
          '<button onclick="removeFromCart(' + idx + ')" style="background:none;border:none;color:#DC2626;font-size:.8rem;font-weight:700;cursor:pointer;padding:0;">Remove</button>' +
        '</div>' +
      '</div>';
  });
  document.getElementById('cart-items-container').innerHTML = itemsHtml;
  var grandTotal = subtotal + DELIVERY_CHARGE;
  document.getElementById('cart-price-breakdown').innerHTML =
    '<div class="price-row"><span>Cart Subtotal</span><span>&#2547;' + fmtBDT(subtotal) + '</span></div>' +
    '<div class="price-row"><span>Delivery (Flat Rate)</span><span>&#2547;' + fmtBDT(DELIVERY_CHARGE) + '</span></div>' +
    '<div class="price-row total-line"><span>Grand Total</span><span>&#2547;' + fmtBDT(grandTotal) + '</span></div>';

  document.getElementById('modal-cart').style.display = '';
  document.getElementById('modal-form').style.display = 'none';
  document.getElementById('modal-success').style.display = 'none';
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

window.proceedToCheckout = function() {
  var subtotal = CART.reduce(function(sum, item){ return sum + item.total; }, 0);
  var grandTotal = subtotal + DELIVERY_CHARGE;
  var requiresAdvance = CART.some(function(item) { return item.payment_option === 'Advance Payment'; });

  document.getElementById('modal-recap').innerHTML =
    '<div style="padding:1rem;border-radius:1rem;background:#F0FDF4;border:1px solid #BBF7D0;display:flex;align-items:center;gap:.75rem;">' +
      '<div class="w-8 h-8 rounded-full bg-forest text-white flex items-center justify-center shrink-0 shadow-sm"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>' +
      '<p style="font-weight:700;font-size:.95rem;color:var(--forest);margin:0;">' + CART.length + (requiresAdvance ? ' item(s) selected (Advance Payment Required)' : ' item(s) ready for Cash on Delivery') + '</p>' +
    '</div>';

  document.getElementById('modal-price-breakdown').innerHTML =
    '<div class="price-row"><span>Cart Subtotal</span><span>&#2547;' + fmtBDT(subtotal) + '</span></div>' +
    '<div class="price-row"><span>Delivery</span><span>&#2547;' + fmtBDT(DELIVERY_CHARGE) + '</span></div>' +
    '<div class="price-row total-line border-t border-slate-200 mt-2 pt-2"><span>Grand Total</span><span>&#2547;' + fmtBDT(grandTotal) + '</span></div>';

  var advanceBlock = document.getElementById('advance-payment-block');
  if (requiresAdvance) {
      advanceBlock.style.display = 'block';
      document.getElementById('btn-text').textContent = 'Confirm Order & Submit TrxID';
  } else {
      advanceBlock.style.display = 'none';
      document.getElementById('btn-text').textContent = 'Confirm Cash on Delivery Order';
  }

  document.getElementById('modal-cart').style.display = 'none';
  document.getElementById('modal-form').style.display = '';
}

window.closeModal = function() {
  document.getElementById('modal-overlay').classList.remove('open');
  setTimeout(() => { document.body.style.overflow = ''; }, 300);
}
window.overlayClick = function(e) { if (e.target.id === 'modal-overlay') closeModal(); }

function setErr(field, msg) {
  var el = document.getElementById('e-' + field);
  el.textContent = msg; el.style.display = 'block';
}
function clearErr(field) { document.getElementById('e-' + field).style.display = 'none'; }

window.submitOrder = async function() {
  clearErr('name'); clearErr('phone'); clearErr('address'); clearErr('trxid');
  var name = document.getElementById('f-name').value.trim();
  var phone = document.getElementById('f-phone').value.trim();
  var address = document.getElementById('f-address').value.trim();
  var advanceBlock = document.getElementById('advance-payment-block');
  var isAdvance = advanceBlock && advanceBlock.style.display !== 'none';
  var trxid = document.getElementById('f-trxid') ? document.getElementById('f-trxid').value.trim() : '';

  var ok = true;
  if (!name) { setErr('name', 'Required.'); ok = false; }
  if (!/^01[3-9]\d{8}$/.test(phone)) { setErr('phone', 'Valid BD number required.'); ok = false; }
  if (!address || address.length < 10) { setErr('address', 'Full address required.'); ok = false; }
  if (isAdvance && !trxid) { setErr('trxid', 'TrxID required.'); ok = false; }
  
  if (!ok || CART.length === 0) return;

  var btn = document.getElementById('confirm-btn');
  btn.disabled = true; document.getElementById('btn-text').textContent = 'Processing...';
  
  var paymentMethod = isAdvance ? 'bKash/Nagod' : 'Cash on Delivery';
  var payloads = CART.map(function(item, index) {
    return {
      product_id: item.productId,
      product_name: item.name,
      quantity: item.qty,
      unit_type: item.unit,
      unit_price: item.total / item.qty,
      total_amount: index === 0 ? item.total + DELIVERY_CHARGE : item.total,
      customer_name: name,
      customer_phone: phone,
      delivery_address: address,
      transaction_id: trxid || null,
      payment_method: paymentMethod
    };
  });

  var result = await db.from('orders').insert(payloads).select();
  if (result.error) {
    alert("Error: " + result.error.message);
    btn.disabled = false;
    return;
  }

  var row = result.data && result.data[0];
  document.getElementById('order-ref').textContent = 'Ref: BP-' + (row ? String(row.id).replace(/-/g,'').slice(0,8).toUpperCase() : 'OK');

  var titleEl = document.getElementById('success-title');
  var subtitleEl = document.getElementById('success-subtitle');
  var msgEl = document.getElementById('success-message-text');

  if (isAdvance) {
      titleEl.textContent = 'Verifying Payment';
      subtitleEl.style.display = 'block'; subtitleEl.textContent = 'TrxID Received!';
      msgEl.innerHTML = 'Our team will review your payment and confirm your order shortly.';
  } else {
      titleEl.textContent = 'Order Confirmed!';
      subtitleEl.style.display = 'none';
      msgEl.innerHTML = 'Your COD order is placed successfully.';
  }

  document.getElementById('modal-form').style.display = 'none';
  document.getElementById('modal-success').style.display = 'block';

  CART = [];
  localStorage.removeItem('bitolpoka_cart');
  updateCartHeader();
}

document.addEventListener('DOMContentLoaded', loadProduct);
</script>

</body>
</html>
